name: WordMac
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: com.gamemagic
  deploymentTarget:
    macOS: "15.0"
targets:
  WordMac:
    type: application
    platform: macOS
    sources:
      - path: WordMac
        excludes: ["*.entitlements", "Info.plist"]
    info:
      path: WordMac/Info.plist
      properties:
        CFBundleDisplayName: WordCraft
        NSAppleScriptEnabled: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 WordCraft"
        NSUbiquitousContainers:
          iCloud.com.gamemagic.wordmac:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: WordCraft
            NSUbiquitousContainerSupportedFolderLevels: Any
        OSAScriptingDefinition: WordCraft.sdef
        CFBundleName: WordCraft
        LSApplicationCategoryType: public.app-category.productivity
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.gamemagic.wordmac.document
            UTTypeDescription: WordCraft Document
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [wmdoc]
        CFBundleDocumentTypes:
          - CFBundleTypeName: WordCraft Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.gamemagic.wordmac.document]
          - CFBundleTypeName: Word Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.wordprocessingml.document, org.openxmlformats.wordprocessingml.template]
          - CFBundleTypeName: Rich Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.rtf]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: Web Page
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
    entitlements:
      path: WordMac/WordMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.print: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamemagic.wordmac
        PRODUCT_NAME: WordCraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
        AppStore:
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_OPTIMIZATION_LEVEL: -O
          CODE_SIGN_ENTITLEMENTS: WordMac/WordCraft-AppStore.entitlements
          CODE_SIGN_IDENTITY: "Apple Distribution"
