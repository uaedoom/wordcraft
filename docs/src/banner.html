<html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
body{width:1600px;height:720px;background:url(bg_hero.jpg) center/cover;color:#fff;position:relative;overflow:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,14,40,.88) 0,rgba(6,14,40,.55) 48%,rgba(6,14,40,0) 75%)}
.left{position:absolute;left:90px;top:100px;width:700px}
.icon{width:120px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
h1{font-size:92px;letter-spacing:-2px;margin:18px 0 6px;font-weight:800}
h1 span{background:linear-gradient(90deg,#7fc4ff,#f3d27a);-webkit-background-clip:text;color:transparent}
p.t{font-size:34px;line-height:1.3;color:#d6e4ff;font-weight:500}
.badges{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.pill.g{background:linear-gradient(90deg,#2f8cff,#5aa9ff);border:0}
.shot{position:absolute;right:-140px;top:120px;width:930px;transform:perspective(1800px) rotateY(-9deg) rotateX(2deg)}
</style></head><body><div class=shade></div>
<div class=left><img class=icon src=icon.png><h1>Word<span>Craft</span></h1>
<p class=t>The free, open-source word processor for your Mac.</p>
<div class=badges><span class="pill g">⬇ Free download</span><span class=pill>.docx ready</span><span class=pill>English + العربية</span><span class=pill>Open source</span></div></div>
<div class="win shot"><img src=shots/page-view.png></div></body></html>
